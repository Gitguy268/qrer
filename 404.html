<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Qrer — page not found</title>
    <style>
      /* Copyright (c) 2026 Lucas Van De Weerd. MIT. Original artwork-free error page. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #008080;
        font:
          12px Tahoma,
          Arial,
          sans-serif;
        color: #111;
      }
      .window {
        width: min(440px, 100%);
        padding: 4px;
        background: #c0c0c0;
        border: 2px outset #eee;
        box-shadow: 5px 5px #0005;
      }
      .title {
        background: linear-gradient(90deg, #000080, #1084d0);
        padding: 5px 7px;
        color: white;
        font-weight: bold;
      }
      .body {
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 28px 22px;
      }
      .code {
        font: 700 32px monospace;
        border: 2px inset #eee;
        background: #fff;
        padding: 7px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 9px;
      }
      p {
        margin: 0;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 22px 20px;
      }
      a,
      button {
        font: inherit;
        color: #000;
        border: 2px outset #eee;
        background: #c0c0c0;
        padding: 5px 18px;
        min-width: 90px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 1px dotted #000;
        outline-offset: -5px;
      }
      .status {
        border: 1px inset #eee;
        padding: 3px 7px;
        font-size: 10px;
        color: #444;
      }
      @media (max-width: 360px) {
        .body {
          padding: 20px 13px;
          gap: 12px;
        }
        .code {
          font-size: 24px;
        }
        .actions {
          padding: 0 13px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="window">
      <div class="title">Qrer</div>
      <div class="body">
        <span class="code" aria-hidden="true">404</span>
        <div>
          <h1>Page not found</h1>
          <p>This address does not point to a Qrer page.</p>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="back">Go back</button><a href="./" id="homeLink">Open Qrer</a>
      </div>
      <div class="status">Nothing was changed.</div>
    </main>
    <script>
      document.getElementById('back').onclick = () => {
        if (history.length > 1) history.back();
        else location.href = document.getElementById('homeLink').href;
      };
    </script>
  </body>
</html>
