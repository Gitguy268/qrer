name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude .git --exclude .github --exclude node_modules --exclude test --exclude tests ./ /tmp/site/
          touch /tmp/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
